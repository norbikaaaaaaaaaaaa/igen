<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentin-nap</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
        
        body {
            background: url('https://4kwallpapers.com/images/wallpapers/valentine-colorful-1920x1080-14800.jpg') center/cover no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-family: 'Pacifico', cursive;
            color: white;
            padding-top: 50px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            font-size: 1.5em;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: pink;
            color: white;
            font-family: 'Pacifico', cursive;
        }
        .gif-container {
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
        .play-button {
            background-color: pink;
            border: none;
            border-radius: 50px;
            color: white;
            padding: 15px 30px;
            font-size: 1.5em;
            cursor: pointer;
            font-family: 'Pacifico', cursive;
        }
        audio {
            display: none;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            button {
                font-size: 1.2em;
                padding: 8px 16px;
            }
            .gif-container img {
                width: 80%;
            }
            #yes-container img {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <h1 id="question">Lennél a Valentinom?</h1>
    <div class="buttons">
        <button id="yes">Igen</button>
        <button id="no">Nem nem szeretnék :(((</button>
    </div>
    <div class="gif-container">
        <img src="https://media.tenor.com/zGm5acSjHCIAAAAM/cat-begging.gif" alt="Please cat">
    </div>
    <div id="yes-container" class="hidden">
        <h1>Igen? Akkor nyomd meg a lejátszás gombot😍</h1>
        <button class="play-button" onclick="playAudio()">▶ Lejátszás</button>
        <br>
        <img src="https://i.pinimg.com/originals/30/73/1d/30731df1cdd458e17e2146a90d7c6b7c.gif" alt="Cat holding heart">
        <audio id="valentine-audio" src="https://yourdomain.com/music.mp3"></audio>
    </div>
    <script>
        let noButton = document.getElementById('no');
        let yesButton = document.getElementById('yes');
        let yesContainer = document.getElementById('yes-container');
        let question = document.getElementById('question');
        let noSize = 1.5;
        
        noButton.addEventListener('click', () => {
            noSize *= 0.8;
            noButton.style.fontSize = noSize + 'em';
            if (noSize < 0.5) {
                noButton.style.display = 'none';
            }
        });
        
        yesButton.addEventListener('click', () => {
            document.querySelector('.buttons').style.display = 'none';
            document.querySelector('.gif-container').style.display = 'none';
            question.style.display = 'none';
            yesContainer.classList.remove('hidden');
        });
        
        function playAudio() {
            document.getElementById("valentine-audio").play();
        }
    </script>
</body>
</html>
